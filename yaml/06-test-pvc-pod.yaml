apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: lvms-test
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: lvms-vg1
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: lvms-test
spec:
  containers:
  - name: test
    image: registry.access.redhat.com/ubi9/ubi-minimal
    command: ["sh", "-c", "echo hello-lvms > /data/test.txt; sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-pvc
