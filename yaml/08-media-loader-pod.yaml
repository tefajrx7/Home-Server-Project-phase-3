apiVersion: v1
kind: Pod
metadata:
  name: media-loader
  namespace: media
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: loader
    image: registry.access.redhat.com/ubi9/ubi
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    volumeMounts:
    - name: media
      mountPath: /media
  volumes:
  - name: media
    persistentVolumeClaim:
      claimName: plex-media
