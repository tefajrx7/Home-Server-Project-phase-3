apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: media
spec:
  selector:
    app: plex
  ports:
  - name: http
    port: 32400
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: plex
  namespace: media
spec:
  to:
    kind: Service
    name: plex
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
