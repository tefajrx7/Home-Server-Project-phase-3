apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: course-lab
spec:
  clusterIP: None
  selector:
    app: db
  ports:
  - name: tcp
    port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: course-lab
spec:
  serviceName: db
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: main
        image: registry.access.redhat.com/ubi9/ubi-minimal
        command: ["sh", "-c", "hostname > /data/id.txt; sleep 86400"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: lvms-vg1
      resources:
        requests:
          storage: 1Gi
